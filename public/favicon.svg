<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="3" fill="#0c0b09"/>

  <!-- Orbital ellipse ring (tilted ~35deg) -->
  <ellipse cx="16" cy="16" rx="13" ry="5.5"
    fill="none" stroke="#c4a97d" stroke-width="1.1"
    transform="rotate(-35 16 16)"/>

  <!-- SP letters -->
  <text x="16" y="20.5"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="11" font-weight="400"
    fill="#c4a97d" text-anchor="middle"
    letter-spacing="0.5">SP</text>

  <!-- Small 4-pointed star bottom right -->
  <path d="M28.5 27.5 L29 28.5 L28.5 29.5 L28 28.5 Z M28.5 27.5 L29.5 28 L28.5 28.5 L27.5 28 Z"
    fill="#c4a97d" opacity="0.7"/>
</svg>
